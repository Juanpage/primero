<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Feedback - Visiting Galápagos</title>
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Dashboard de Feedback</h1>
  </header>

  <main class="container">
    <section class="filters card">
      <div>
        <label>Embarcación</label>
        <select id="vessel-filter">
          <option value="">Todas</option>
          <option value="vessel-a">Vessel A</option>
          <option value="vessel-b">Vessel B</option>
          <option value="vessel-c">Vessel C</option>
        </select>
      </div>
      <div>
        <label>Estado</label>
        <select id="status-filter">
          <option value="">Todos</option>
          <option value="Pending">Pendiente</option>
          <option value="Managed">Gestionado</option>
        </select>
      </div>
      <div>
        <label>Desde</label>
        <input type="date" id="from-date" />
      </div>
      <div>
        <label>Hasta</label>
        <input type="date" id="to-date" />
      </div>
      <button id="apply-filters">Aplicar</button>
    </section>

    <section class="kpis">
      <div class="kpi card">
        <h3>Total Feedback</h3>
        <span id="kpi-total">0</span>
      </div>
      <div class="kpi card">
        <h3>Promedio Rating</h3>
        <span id="kpi-average">0</span>
      </div>
      <div class="kpi card">
        <h3>% Negativos</h3>
        <span id="kpi-negative">0%</span>
      </div>
      <div class="kpi card">
        <h3>Pending</h3>
        <span id="kpi-pending">0</span>
      </div>
      <div class="kpi card">
        <h3>Managed</h3>
        <span id="kpi-managed">0</span>
      </div>
    </section>

    <section class="charts">
      <div class="card">
        <h3>Promedio rating por día</h3>
        <canvas id="rating-chart"></canvas>
      </div>
      <div class="card">
        <h3>Feedback por día</h3>
        <canvas id="count-chart"></canvas>
      </div>
      <div class="card">
        <h3>Alertas Pending vs Managed</h3>
        <canvas id="alert-chart"></canvas>
      </div>
    </section>

    <section class="card">
      <h3>Listado de feedback</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Embarcación</th>
            <th>Rating</th>
            <th>Comentario</th>
            <th>Email</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="feedback-body"></tbody>
      </table>
      <div class="pagination">
        <button id="prev-page">Anterior</button>
        <span id="page-info">1</span>
        <button id="next-page">Siguiente</button>
      </div>
    </section>
  </main>

  <script src="../assets/js/admin.js"></script>
</body>
</html>
