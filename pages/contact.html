<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | Visiting World</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <div data-include="/components/header.html"></div>
  <main class="section">
    <div class="container">
      <div class="section__header">
        <h1 class="section__title">Contacto</h1>
        <p class="section__subtitle">Comunicación accesible por email, WhatsApp y operadores humanos.</p>
      </div>
      <form class="form" id="contact-form" novalidate>
        <div class="form__group">
          <label class="form__label" for="contact-name">Nombre*</label>
          <input class="form__input" id="contact-name" name="nombre" required />
        </div>
        <div class="form__group">
          <label class="form__label" for="contact-email">Email*</label>
          <input class="form__input" id="contact-email" name="email" type="email" required />
        </div>
        <div class="form__group">
          <label class="form__label" for="contact-destination">Destino*</label>
          <input class="form__input" id="contact-destination" name="destino" required />
        </div>
        <div class="form__group">
          <label class="form__label" for="contact-message">Mensaje</label>
          <textarea class="form__textarea" id="contact-message" name="mensaje"></textarea>
        </div>
        <button class="btn btn--primary" type="submit">Enviar</button>
        <p id="contact-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <div data-include="/components/footer.html"></div>
  <script src="/assets/js/email.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-include]').forEach(async (el) => {
        const res = await fetch(el.getAttribute('data-include'));
        el.outerHTML = await res.text();
      });
    });
  </script>
</body>
</html>
