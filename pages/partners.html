<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socios Estratégicos | Visiting World</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <div data-include="/components/header.html"></div>
  <main class="section">
    <div class="container partners">
      <div class="section__header">
        <h1 class="section__title">Socios estratégicos</h1>
        <p class="section__subtitle">Colaboraciones confiables para experiencias premium, accesibles y seguras.</p>
      </div>
      <div class="partners__viewport" id="partners-viewport" aria-live="polite">
        <div class="partners__track" id="partners-track"></div>
      </div>
      <div class="partners__controls" aria-label="Controles del slider de socios">
        <div class="partners__arrows">
          <button class="partners__arrow" id="partners-prev" aria-label="Anterior socio">◀</button>
          <button class="partners__arrow" id="partners-next" aria-label="Siguiente socio">▶</button>
        </div>
        <div class="partners__dots" id="partners-dots" role="tablist" aria-label="Paginación de socios"></div>
      </div>
    </div>
  </main>
  <div data-include="/components/footer.html"></div>
  <script src="/assets/js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-include]').forEach(async (el) => {
        const res = await fetch(el.getAttribute('data-include'));
        el.outerHTML = await res.text();
      });
    });
  </script>
</body>
</html>
